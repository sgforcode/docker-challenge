services:
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: pern_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: taskboard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    restart: always
    container_name: pern_server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
        
    
  client:
    build: ./client
    container_name: pern_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
   

volumes:
  postgres_data: 